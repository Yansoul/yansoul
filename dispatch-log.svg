<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Yansoul · Postal dispatch log of recent commits">
  <defs>
    <style>
      .serif { font-family: 'Iowan Old Style', 'Palatino', 'Georgia', 'Times New Roman', serif; }
      .mono  { font-family: 'Courier New', 'Courier', 'Menlo', monospace; }

      .row { transform-box: fill-box; transform-origin: center; opacity: 0; }
      .r1 { animation: stamp-drop-loop 10s cubic-bezier(.2,.7,.3,1.2) .25s infinite; }
      .r2 { animation: stamp-drop-loop 10s cubic-bezier(.2,.7,.3,1.2) .85s infinite; }
      .r3 { animation: stamp-drop-loop 10s cubic-bezier(.2,.7,.3,1.2) 1.45s infinite; }
      .r4 { animation: stamp-drop-loop 10s cubic-bezier(.2,.7,.3,1.2) 2.05s infinite; }
      .r5 { animation: stamp-drop-loop 10s cubic-bezier(.2,.7,.3,1.2) 2.65s infinite; }

      @keyframes stamp-drop-loop {
        0%    { opacity: 0;   transform: scale(1.7) rotate(-3.5deg) translateY(-10px); }
        3%    { opacity: 1;   transform: scale(.94) rotate(.6deg)   translateY(2px); }
        4.3%  { opacity: 1;   transform: scale(1.03) rotate(-.3deg) translateY(0); }
        5.5%  { opacity: 1;   transform: scale(1)   rotate(0)        translateY(0); }
        70%   { opacity: 1;   transform: scale(1)   rotate(0)        translateY(0); }
        92%   { opacity: 0;   transform: scale(1)   rotate(0)        translateY(0); }
        100%  { opacity: 0;   transform: scale(1.7) rotate(-3.5deg) translateY(-10px); }
      }

      .ink {
        transform-box: fill-box; transform-origin: center;
        opacity: 0;
        animation: ink-bleed-loop 10s cubic-bezier(.2,.7,.3,1.2) infinite;
      }
      @keyframes ink-bleed-loop {
        0%, 33%  { opacity: 0;   transform: scale(1.5) rotate(-18deg); }
        36.7%    { opacity: .95; transform: scale(.97) rotate(-11deg); }
        38%      { opacity: .9;  transform: scale(1)   rotate(-12deg); }
        70%      { opacity: .9;  transform: scale(1)   rotate(-12deg); }
        92%      { opacity: 0;   transform: scale(1)   rotate(-12deg); }
        100%     { opacity: 0;   transform: scale(1.5) rotate(-18deg); }
      }

      .postmark {
        transform-box: fill-box; transform-origin: center;
        animation: pulse 3.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: .55; transform: scale(1); }
        50%      { opacity: .85; transform: scale(1.02); }
      }

      .blink { animation: blink 1.1s steps(1, end) infinite; animation-delay: 3.4s; }
      @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    </style>

    <pattern id="dispatchPaper" patternUnits="userSpaceOnUse" width="220" height="220">
      <rect width="220" height="220" fill="#e3e9f0"/>
      <circle cx="40"  cy="30"  r="0.7" fill="#b8c2cd" opacity="0.35"/>
      <circle cx="120" cy="80"  r="0.6" fill="#b8c2cd" opacity="0.35"/>
      <circle cx="170" cy="150" r="0.8" fill="#b8c2cd" opacity="0.35"/>
      <circle cx="60"  cy="170" r="0.5" fill="#b8c2cd" opacity="0.35"/>
      <circle cx="100" cy="190" r="0.4" fill="#b8c2cd" opacity="0.35"/>
    </pattern>

    <pattern id="airmailStripes" patternUnits="userSpaceOnUse" width="22" height="22" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="#e3e9f0"/>
      <rect x="0"  y="0"  width="11" height="11" fill="#c54138"/>
      <rect x="11" y="11" width="11" height="11" fill="#1c3a58"/>
    </pattern>
  </defs>

  <rect width="800" height="340" fill="#cfd8e3"/>

  <g transform="translate(60, 24)">
    <rect width="680" height="292" fill="url(#dispatchPaper)" stroke="#1f1f1f" stroke-width="1.5"/>

    <rect x="0" y="0"   width="680" height="10" fill="url(#airmailStripes)" opacity="0.85"/>
    <rect x="0" y="282" width="680" height="10" fill="url(#airmailStripes)" opacity="0.85"/>

    <rect x="18" y="22" width="644" height="248" fill="none" stroke="#1c3a58" stroke-width="1"/>

    <text x="30"  y="44" class="serif" font-size="11" letter-spacing="3.5" fill="#1c3a58" font-weight="700">POSTAL DISPATCH LOG</text>
    <text x="650" y="44" class="serif" font-size="11" letter-spacing="2.5" fill="#1f1f1f" text-anchor="end">YANSOUL POST OFFICE · MAY MMXXVI</text>
    <line x1="30" y1="54" x2="650" y2="54" stroke="#1c3a58" stroke-width="0.5"/>

    <text x="30"  y="72" class="mono" font-size="8" letter-spacing="2" fill="#1c3a58">CACHET</text>
    <text x="118" y="72" class="mono" font-size="8" letter-spacing="2" fill="#1c3a58">REF.</text>
    <text x="206" y="72" class="mono" font-size="8" letter-spacing="2" fill="#1c3a58">DISPATCH MESSAGE</text>
    <text x="650" y="72" class="mono" font-size="8" letter-spacing="2" fill="#1c3a58" text-anchor="end">POSTED</text>
    <line x1="30" y1="78" x2="650" y2="78" stroke="#1c3a58" stroke-width="0.4" stroke-dasharray="2 2"/>

    <!-- COMMITS:START -->
    <g class="row r1">
      <rect x="28" y="86" width="74" height="22" fill="none" stroke="#1c3a58" stroke-width="1.2"/>
      <text x="65" y="101" class="mono" font-size="9" letter-spacing="1.4" fill="#c54138" font-weight="700" text-anchor="middle">★ POSTED</text>
      <text x="118" y="102" class="mono" font-size="11" fill="#1f1f1f">a417f5e</text>
      <text x="206" y="102" class="mono" font-size="11" fill="#1f1f1f">time-overlay: feat: prepare Time Overlay for AdSe…</text>
      <text x="650" y="102" class="mono" font-size="10" fill="#1f1f1f" text-anchor="end">2 days</text>
    </g>

    <g class="row r2">
      <rect x="28" y="118" width="74" height="22" fill="none" stroke="#1c3a58" stroke-width="1.2"/>
      <text x="65" y="133" class="mono" font-size="9" letter-spacing="1.4" fill="#c54138" font-weight="700" text-anchor="middle">★ POSTED</text>
      <text x="118" y="134" class="mono" font-size="11" fill="#1f1f1f">fa4410f</text>
      <text x="206" y="134" class="mono" font-size="11" fill="#1f1f1f">time-overlay: feat: enable approved AdSense servi…</text>
      <text x="650" y="134" class="mono" font-size="10" fill="#1f1f1f" text-anchor="end">2 days</text>
    </g>

    <g class="row r3">
      <rect x="28" y="150" width="74" height="22" fill="none" stroke="#1c3a58" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.4"/>
      <text x="65" y="165" class="mono" font-size="9" letter-spacing="1.4" fill="#1c3a58" font-weight="700" text-anchor="middle" opacity="0.4">- PEND -</text>
      <text x="118" y="166" class="mono" font-size="11" fill="#1f1f1f" opacity="0.45">·······</text>
      <text x="206" y="166" class="mono" font-size="11" fill="#1f1f1f" opacity="0.45">awaiting next dispatch</text>
      <text x="650" y="166" class="mono" font-size="10" fill="#1f1f1f" text-anchor="end" opacity="0.45">—</text>
    </g>

    <g class="row r4">
      <rect x="28" y="182" width="74" height="22" fill="none" stroke="#1c3a58" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.4"/>
      <text x="65" y="197" class="mono" font-size="9" letter-spacing="1.4" fill="#1c3a58" font-weight="700" text-anchor="middle" opacity="0.4">- PEND -</text>
      <text x="118" y="198" class="mono" font-size="11" fill="#1f1f1f" opacity="0.45">·······</text>
      <text x="206" y="198" class="mono" font-size="11" fill="#1f1f1f" opacity="0.45">awaiting next dispatch</text>
      <text x="650" y="198" class="mono" font-size="10" fill="#1f1f1f" text-anchor="end" opacity="0.45">—</text>
    </g>

    <g class="row r5">
      <rect x="28" y="214" width="74" height="22" fill="none" stroke="#1c3a58" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.4"/>
      <text x="65" y="229" class="mono" font-size="9" letter-spacing="1.4" fill="#1c3a58" font-weight="700" text-anchor="middle" opacity="0.4">- PEND -</text>
      <text x="118" y="230" class="mono" font-size="11" fill="#1f1f1f" opacity="0.45">·······</text>
      <text x="206" y="230" class="mono" font-size="11" fill="#1f1f1f" opacity="0.45">awaiting next dispatch</text>
      <text x="650" y="230" class="mono" font-size="10" fill="#1f1f1f" text-anchor="end" opacity="0.45">—</text>
    </g>
    <!-- COMMITS:END -->

    <line x1="30" y1="248" x2="650" y2="248" stroke="#1c3a58" stroke-width="0.4" stroke-dasharray="2 2"/>
    <text x="30"  y="262" class="serif" font-size="9" letter-spacing="2.5" fill="#1f1f1f">RECEIVED FROM github.com/Yansoul · ROUTING ∞</text>
    <text x="650" y="262" class="serif" font-size="9" letter-spacing="2.5" fill="#1f1f1f" text-anchor="end">PAGE I / I</text>

    <g class="ink" transform="translate(560, 116)">
      <rect x="-52" y="-16" width="104" height="32" fill="none" stroke="#6b4f8c" stroke-width="2"/>
      <rect x="-47" y="-11" width="94"  height="22" fill="none" stroke="#6b4f8c" stroke-width="0.5"/>
      <text x="0" y="5" class="serif" font-size="14" letter-spacing="3" fill="#6b4f8c" font-weight="900" text-anchor="middle">DISPATCHED</text>
    </g>
  </g>

  <g transform="translate(736, 304)" class="postmark">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1f1f1f" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#1f1f1f" stroke-width="0.5"/>
    <text x="0" y="-9" class="serif" font-size="6"  fill="#1f1f1f" text-anchor="middle" letter-spacing="1.5">DISPATCHED</text>
    <text x="0" y="3"  class="serif" font-size="10" fill="#1f1f1f" text-anchor="middle" font-weight="900">2026</text>
    <text x="0" y="14" class="serif" font-size="5"  fill="#1f1f1f" text-anchor="middle" letter-spacing="1.5">YANSOUL</text>
  </g>

  <text x="76" y="332" class="mono blink" font-size="11" fill="#c54138">▌</text>
</svg>
